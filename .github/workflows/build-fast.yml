# Builds the optional compiled speed-up (game/scripts/_fast.pyx) on GitHub's machines,
# so you don't need Visual Studio Build Tools on your PC.
#
# Run it: GitHub -> Actions -> "Build _fast" -> Run workflow. It also runs by itself when
# _fast.pyx or build_fast.py change. Download the result from the run's "Artifacts" box,
# unzip it, and put the .pyd file in  game\scripts\  (next to physics.py).
#
# Python 3.11 on Windows gives  _fast.cp311-win_amd64.pyd  (your PC).
name: Build _fast

on:
  workflow_dispatch:
    inputs:
      compile_physics:
        description: "Also compile physics.py (build_fast.py --all)"
        type: boolean
        default: false
  push:
    paths:
      - "game/scripts/_fast.pyx"
      - "game/build_fast.py"
      - ".github/workflows/build-fast.yml"

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest,  python: "3.11" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install build tools
        run: python -m pip install --upgrade pip cython setuptools

      - name: Build
        shell: bash
        working-directory: game
        run: |
          if [ "${{ inputs.compile_physics }}" = "true" ]; then
            python build_fast.py --all
          else
            python build_fast.py
          fi

      - name: Check the compiled module loads
        shell: bash
        run: python -c "import game.scripts._fast as f; print('loaded', f.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: fast-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            game/scripts/_fast*.pyd
            game/scripts/_fast*.so
            game/scripts/physics*.pyd
            game/scripts/physics*.so
          if-no-files-found: error
